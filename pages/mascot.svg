<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 180" width="210" height="270" role="img" aria-labelledby="t d">
  <title id="t">The muir-sys mascot</title>
  <desc id="d">A 3.5-inch diskette with a happy face, its metal shutter at the top and a blank paper label, waving.</desc>
  <!-- The system's character, in the family of ozd's page: each project is an
       object wearing Cold Boot's face and waving arm, whose shapes are Cold
       Boot's own (CC BY-SA 4.0). CADR is the terminal, OZ the cabinet,
       muir-fpga the board; the system is the software, so it is a diskette:
       ink, paper and one spot color, fluorescent pink. The label is blank,
       because the system takes no name of its own. -->
  <defs>
    <g id="face-happy">
      <ellipse cx="46" cy="50" rx="9" ry="13" fill="#fff"/>
      <ellipse cx="74" cy="50" rx="9" ry="13" fill="#fff"/>
      <ellipse cx="47" cy="53" rx="6.2" ry="9.5" fill="#141414"/>
      <ellipse cx="73" cy="53" rx="6.2" ry="9.5" fill="#141414"/>
      <ellipse cx="47" cy="58" rx="4.6" ry="3.6" fill="#ff48b0"/>
      <ellipse cx="73" cy="58" rx="4.6" ry="3.6" fill="#ff48b0"/>
      <circle cx="44.5" cy="48" r="2.8" fill="#fff"/>
      <circle cx="70.5" cy="48" r="2.8" fill="#fff"/>
      <circle cx="49" cy="57" r="1.2" fill="#fff"/>
      <circle cx="75" cy="57" r="1.2" fill="#fff"/>
      <path d="M54 74q6 6 12 0" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M29 70l3-5M33 70l3-5M37 70l3-5M80 70l3-5M84 70l3-5M88 70l3-5" stroke="#ff48b0" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="arm-wave">
      <path d="M106 64q17-4 14-25" fill="none" stroke="#141414" stroke-width="4" stroke-linecap="round"/>
      <circle cx="120" cy="36" r="5.5" fill="#fff" stroke="#141414" stroke-width="3"/>
      <path d="M111 22l3 5M120 18v6M129 22l-3 5" stroke="#141414" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </defs>
  <rect x="44" y="146" width="10" height="14" fill="#141414"/><rect x="66" y="146" width="10" height="14" fill="#141414"/><polygon points="10,26 102,26 110,34 110,148 10,148" fill="#141414"/><rect x="34" y="26" width="52" height="30" rx="2" fill="#fff" stroke="#141414" stroke-width="3"/><rect x="66" y="31" width="12" height="20" fill="#141414"/><use href="#face-happy" y="30"/><rect x="20" y="116" width="80" height="28" rx="2" fill="#fff"/><rect x="20" y="116" width="80" height="5" fill="#ff48b0"/><use href="#arm-wave" x="4" y="36"/>
</svg>
